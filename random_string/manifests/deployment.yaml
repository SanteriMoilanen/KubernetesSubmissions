apiVersion: apps/v1
kind: Deployment
metadata:
  name: random-strings-deployment
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: random-strings
  template:
    metadata:
      labels:
        app: random-strings
    spec:
      volumes:
      - name: shared-log
        emptyDir: {}
      containers:
      - name: random-string-reader
        image: random-string-reader:1.2
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: shared-log
          mountPath: /usr/src/app/files
      - name: random-string-writer
        image: random-string-writer:1.1
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: shared-log
          mountPath: /usr/src/app/files
