apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeter-v1
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels: { app: greeter, version: v1 }
  template:
    metadata:
      labels: { app: greeter, version: v1 }
    spec:
      containers:
      - name: greeter
        image: PROJECT/GREETER
        env:
        - { name: GREETING, value: "hello from v1" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeter-v2
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels: { app: greeter, version: v2 }
  template:
    metadata:
      labels: { app: greeter, version: v2 }
    spec:
      containers:
      - name: greeter
        image: PROJECT/GREETER
        env:
        - { name: GREETING, value: "moi from v2" }
---
# Front service the log output app calls; the HTTPRoute below splits it
apiVersion: v1
kind: Service
metadata:
  name: greeter-svc
  namespace: exercises
spec:
  selector: { app: greeter }
  ports:
  - { port: 2345, targetPort: 3000 }
---
apiVersion: v1
kind: Service
metadata:
  name: greeter-svc-1
  namespace: exercises
spec:
  selector: { app: greeter, version: v1 }
  ports:
  - { port: 2345, targetPort: 3000 }
---
apiVersion: v1
kind: Service
metadata:
  name: greeter-svc-2
  namespace: exercises
spec:
  selector: { app: greeter, version: v2 }
  ports:
  - { port: 2345, targetPort: 3000 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: greeter-split
  namespace: exercises
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: greeter-svc
    port: 2345
  rules:
  - backendRefs:
    - { name: greeter-svc-1, port: 2345, weight: 75 }
    - { name: greeter-svc-2, port: 2345, weight: 25 }
