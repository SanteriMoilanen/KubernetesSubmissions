name: Todo release
on:
  push:
    branches: [main]
    paths: ['todo/**']
jobs:
  release:
    if: github.actor != 'github-actions[bot]'   # skip the bot's own commit
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: todo } }
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push
        run: |
          docker build -t smoilanen/todo-app:$GITHUB_SHA todo-app
          docker build -t smoilanen/todo-app-be:$GITHUB_SHA todo-be
          docker build -t smoilanen/todo-broadcaster:$GITHUB_SHA broadcaster
          docker push smoilanen/todo-app:$GITHUB_SHA
          docker push smoilanen/todo-app-be:$GITHUB_SHA
          docker push smoilanen/todo-broadcaster:$GITHUB_SHA
      - uses: imranismail/setup-kustomize@v3
      - name: Set images
        run: |
          kustomize edit set image PROJECT/TODO-APP=smoilanen/todo-app:$GITHUB_SHA
          kustomize edit set image PROJECT/TODO-APP-BE=smoilanen/todo-app-be:$GITHUB_SHA
          kustomize edit set image PROJECT/BROADCASTER=smoilanen/todo-broadcaster:$GITHUB_SHA
      - uses: EndBug/add-and-commit@v10
        with:
          add: todo/kustomization.yaml
          message: Todo release ${{ github.sha }}
          pull: --rebase --autostash
