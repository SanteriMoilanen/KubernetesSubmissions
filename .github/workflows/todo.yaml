name: Release todo project

on:
  push:
    paths:
      - 'todo/**'
      - '.github/workflows/todo.yaml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-north1-b
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: my-repository
  BRANCH: ${{ github.ref_name }}

defaults:
  run:
    working-directory: todo

jobs:
  build-publish-deploy:
    name: Build, Publish and Deploy
    runs-on: ubuntu-latest
    environment: GKE_PROJECT

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: '${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - run: gcloud --quiet auth configure-docker $REGISTRY

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          project_id: '${{ env.PROJECT_ID }}'
          location: '${{ env.GKE_ZONE }}'

      - name: Form the image names
        run: |-
          echo "APP_IMAGE=$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-app:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV
          echo "BE_IMAGE=$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-app-be:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV

      - name: Build
        run: |-
          docker build --tag $APP_IMAGE todo-app
          docker build --tag $BE_IMAGE todo-be

      - name: Publish
        run: |-
          docker push $APP_IMAGE
          docker push $BE_IMAGE

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Deploy
        run: |-
          kustomize edit set image PROJECT/TODO-APP=$APP_IMAGE PROJECT/TODO-APP-BE=$BE_IMAGE
          kustomize build . | kubectl apply -f -
          kubectl rollout status deployment todo-app -n project
          kubectl rollout status deployment todo-app-be -n project
          kubectl get services -o wide -n project
