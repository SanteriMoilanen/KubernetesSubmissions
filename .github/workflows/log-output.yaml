name: Log output release
on:
  push:
    branches: [main]
    paths: ['random_string/**']
jobs:
  release:
    if: github.actor != 'github-actions[bot]'   # skip the bot's own commit
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: random_string } }
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push
        run: |
          docker build -t smoilanen/random-string-reader:$GITHUB_SHA random_string_reader
          docker build -t smoilanen/random-string-writer:$GITHUB_SHA random_string_writer
          docker push smoilanen/random-string-reader:$GITHUB_SHA
          docker push smoilanen/random-string-writer:$GITHUB_SHA
          docker build -t smoilanen/greeter:$GITHUB_SHA greeter
          docker push smoilanen/greeter:$GITHUB_SHA
      - uses: imranismail/setup-kustomize@v3
      - name: Set images
        run: |
          kustomize edit set image PROJECT/READER=smoilanen/random-string-reader:$GITHUB_SHA
          kustomize edit set image PROJECT/WRITER=smoilanen/random-string-writer:$GITHUB_SHA
          kustomize edit set image PROJECT/GREETER=smoilanen/greeter:$GITHUB_SHA
      - uses: EndBug/add-and-commit@v10
        with:
          add: random_string/kustomization.yaml
          message: Log output release ${{ github.sha }}
          pull: --rebase --autostash