apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-be
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app-be
  template:
    metadata:
      labels:
        app: todo-app-be
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: todo-app-be
        image: PROJECT/TODO-APP-BE
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        readinessProbe:
          initialDelaySeconds: 10 # Initial delay until the readiness is tested
          periodSeconds: 5 # How often to test
          httpGet:
              path: /healthz
              port: 3000
        livenessProbe:
          initialDelaySeconds: 20 # Initial delay until the liveness is tested
          periodSeconds: 5 # How often to test
          httpGet:
              path: /healthz
              port: 3000
        envFrom:
        - configMapRef:
            name: todo-config    # NATS_URL
        env:
        - name: PORT
          value: "3000"
        - name: PGHOST
          value: postgres-svc
        - name: PGUSER
          value: postgres
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD