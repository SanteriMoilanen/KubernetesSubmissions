apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-be
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app-be
  template:
    metadata:
      labels:
        app: todo-app-be
    spec:
      containers:
      - name: todo-app-be
        image: PROJECT/TODO-APP-BE
        env:
        - name: PORT
          value: "3000"
        - name: PGHOST
          value: postgres-svc
        - name: PGUSER
          value: postgres
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD