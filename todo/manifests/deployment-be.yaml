apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-be
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app-be
  template:
    metadata:
      labels:
        app: todo-app-be
    spec:
      containers:
      - name: todo-app-be
        image: todo-app-be:1.1
        imagePullPolicy: IfNotPresent
        env:
        - name: PORT
          value: "3000"
