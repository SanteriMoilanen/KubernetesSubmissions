apiVersion: apps/v1
kind: Deployment
metadata:
  name: broadcaster
  namespace: project
spec:
  replicas: 6
  selector:
    matchLabels:
      app: broadcaster
  template:
    metadata:
      labels:
        app: broadcaster
    spec:
      containers:
      - name: broadcaster
        image: PROJECT/BROADCASTER
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        envFrom:
        - configMapRef:
            name: todo-config    # NATS_URL
        env:
        - name: WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: broadcaster-secret
              key: WEBHOOK_URL
