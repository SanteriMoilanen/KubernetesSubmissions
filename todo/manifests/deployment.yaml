apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: project
spec:
  replicas: 1
  strategy:
    type: Recreate  # RWO volume can't be mounted by old and new pod at once
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000  # node user can write to the PVC
      volumes:
      - name: todo-volume
        persistentVolumeClaim:
          claimName: todo-claim
      containers:
      - name: todo-app
        image: PROJECT/TODO-APP
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        readinessProbe:
          initialDelaySeconds: 10 # Initial delay until the readiness is tested
          periodSeconds: 5 # How often to test
          httpGet:
              path: /healthz
              port: 3000
        livenessProbe:
          initialDelaySeconds: 20 # Initial delay until the liveness is tested
          periodSeconds: 5 # How often to test
          httpGet:
              path: /healthz
              port: 3000
        envFrom:
        - configMapRef:
            name: todo-config
        env:
        - name: PORT
          value: "3000"
        volumeMounts:
        - name: todo-volume
          mountPath: /usr/src/app/files
