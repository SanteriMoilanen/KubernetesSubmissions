apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: project
spec:
  replicas: 1
  strategy:
    type: Recreate  # RWO volume can't be mounted by old and new pod at once
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
      - name: todo-volume
        persistentVolumeClaim:
          claimName: todo-claim
      containers:
      - name: todo-app
        image: PROJECT/TODO-APP
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        envFrom:
        - configMapRef:
            name: todo-config
        env:
        - name: PORT
          value: "3000"
        volumeMounts:
        - name: todo-volume
          mountPath: /usr/src/app/files
