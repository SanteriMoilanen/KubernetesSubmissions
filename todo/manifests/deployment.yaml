apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
      - name: todo-volume
        persistentVolumeClaim:
          claimName: todo-claim
      containers:
      - name: todo-app
        image: todo-app:1.4
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: todo-config
        env:
        - name: PORT
          value: "3000"
        volumeMounts:
        - name: todo-volume
          mountPath: /usr/src/app/files
