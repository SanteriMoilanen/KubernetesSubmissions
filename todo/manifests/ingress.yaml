apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-app-ingress
  namespace: project
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: todo
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: todo-app-svc
            port:
              number: 3000
      - path: /todos
        pathType: Prefix
        backend:
          service:
            name: todo-app-be-svc
            port:
              number: 3000