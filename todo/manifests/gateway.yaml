apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: todo-gateway
  namespace: project
spec:
  gatewayClassName: traefik
  listeners:
  - name: http
    protocol: HTTP
    port: 8000  # traefik "web" entrypoint
    hostname: todo.localhost  # random_string route also claims "/" on this port
    allowedRoutes:
      kinds:
      - kind: HTTPRoute