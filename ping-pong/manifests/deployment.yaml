apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ping-pong-deployment
  namespace: exercises
spec:
  replicas: 1
  strategy:
    canary:
      steps:
      - setWeight: 50
      - analysis:
          templates:
          - templateName: cpu-usage
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      containers:
      - name: ping-pong
        image: smoilanen/ping-pong:1.6
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /pings
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: PGHOST
          value: postgres-svc
        - name: PGUSER
          value: postgres
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
