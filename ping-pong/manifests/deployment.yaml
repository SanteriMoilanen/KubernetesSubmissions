apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      volumes:
      - name: common-volume
        persistentVolumeClaim:
          claimName: common-claim
      containers:
      - name: ping-pong
        image: ping-pong:1.1
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: common-volume
          mountPath: /usr/src/app/files
