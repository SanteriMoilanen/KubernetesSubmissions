# Extra Traefik entrypoint for the todo project, reachable at localhost:8082
# (k3d maps 8082 -> nodePort 30080 on the loadbalancer)
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    additionalArguments:
      - "--entryPoints.todo.address=:8082/tcp"
---
apiVersion: v1
kind: Service
metadata:
  name: traefik-todo
  namespace: kube-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - port: 8082
      targetPort: 8082
      nodePort: 30080
